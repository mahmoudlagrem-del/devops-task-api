name: DevOps Task API CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Run SAST (Static Analysis)
      - name: Run SAST (npm audit)
        run: npm audit --audit-level=high

      # 5️⃣ Run Jest tests
      - name: Run Jest tests
        run: ./node_modules/.bin/jest --detectOpenHandles

      # 6️⃣ Lint code
      - name: Lint code
        run: |
          npm install eslint
          npx eslint index.js || echo "Lint warnings only"
          
      - name: Fix permissions for ZAP
        run: chmod -R a+w .



      # 7️⃣ Start API (required for DAST)
      - name: Start API
        run: |
          node index.js &
          sleep 15

      # 8️⃣ Run DAST scan with ZAP
      - name: Run DAST scan
        uses: zaproxy/action-baseline@v0.9.0
        with:
          target: http://localhost:3000/health
          cmd_options: -J report_json.json -w report_md.md -r report_html.html
          artifact_name: zap-report


      - name: Upload ZAP reports
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: |
            report_json.json
            report_md.md
            report_html.html
     


      # 9️⃣ Build Docker image
      - name: Build Docker image
        run: docker build -t devops-task-api .

      # 🔟 Save build logs
      - name: Save build logs
        run: |
          echo "Build completed at $(date)" > build.log
          cat build.log
