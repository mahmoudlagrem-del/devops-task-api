name: DevOps Task API CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run SAST (npm audit)
        run: npm audit --audit-level=high

      - name: Run Jest tests
        run: ./node_modules/.bin/jest --detectOpenHandles

      - name: Lint code
        run: |
          npm install eslint
          npx eslint index.js || echo "Lint warnings only"

      - name: Start API
        run: |
          node index.js &
          sleep 10

      - name: Run DAST scan
        uses: zaproxy/action-baseline@v0.9.0
        with:
          target: http://localhost:3000

      - name: Build Docker image
        run: docker build -t devops-task-api .

      - name: Save build logs
        run: |
          echo "Build completed at $(date)" > build.log
          cat build.log
